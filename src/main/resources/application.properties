spring.config.import=optional:file:.env.properties

spring.application.name=cafe

# PostgreSQL Database Configuration

spring.datasource.url=jdbc:postgresql://localhost:9000/mydb
spring.datasource.username=postgres
spring.datasource.password=password

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# logging.level.org.hibernate.SQL=INFO
# logging.level.org.hibernate.orm.jdbc.bind=WARN

# JWT Configuration
# Import local environment properties securely
 application.security.jwt.secret-key=${JWT_SECRET}

# Token expiration: 24 hours (milliseconds)
application.security.jwt.expiration=7200000

application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
# application.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://your-production-frontend.netlify.app

# server.port=${PORT:10000}
